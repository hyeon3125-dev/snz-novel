name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 정본에서 커밋 각본 재현
        run: |
          for lang in ko en jp; do
            case "$lang" in
              ko) stem=KO; script=game/script.js ;;
              en) stem=EN; script=game/script.en.js ;;
              jp) stem=JP; script=game/script.jp.js ;;
            esac
            python3 tools/verify_rebuild.py "$script" \
              manuscript/SNZ_${stem}_Part1.md manuscript/SNZ_${stem}_Part2.md \
              manuscript/SNZ_${stem}_Part3.md manuscript/SNZ_${stem}_Part4.md \
              manuscript/SNZ_${stem}_Part5.md \
              -a tools/annotations/base.json -a tools/annotations/${lang}.json
          done

      - name: 원문 위치·순서 무결성
        run: |
          for lang in ko en jp; do
            case "$lang" in
              ko) stem=KO; script=game/script.js ;;
              en) stem=EN; script=game/script.en.js ;;
              jp) stem=JP; script=game/script.jp.js ;;
            esac
            python3 tools/verify_integrity.py "$script" \
              manuscript/SNZ_${stem}_Part1.md manuscript/SNZ_${stem}_Part2.md \
              manuscript/SNZ_${stem}_Part3.md manuscript/SNZ_${stem}_Part4.md \
              manuscript/SNZ_${stem}_Part5.md \
              -a tools/annotations/base.json -a tools/annotations/${lang}.json
          done

      - name: 언어판 구조·연출 패리티
        run: |
          python3 tools/verify_parity.py game/script.en.js
          python3 tools/verify_parity.py game/script.jp.js

      - name: 원고 편집 잔재·미번역 검사
        run: |
          if rg -n '⟦TODO_(EN|JP)⟧|[가-힣]' manuscript/SNZ_EN_Part*.md manuscript/SNZ_JP_Part*.md; then
            echo '번역판에 TODO 또는 한글이 남았습니다.' >&2
            exit 1
          fi
          if rg -n '^={5,}$|^# Volume |^## Vol\.|기원 봉인 유지|여기까지 가는 길이 이 파트|이 파트의 끝에서' manuscript/SNZ_??_Part*.md; then
            echo 'v3 원고에 편집·구판 잔재가 남았습니다.' >&2
            exit 1
          fi

      - name: 어노테이션 근거·복선 인과
        run: |
          python3 tools/verify_annotations.py game/script.js \
            -a tools/annotations/base.json -a tools/annotations/ko.json

      - name: 그래프·봉인
        run: |
          node tools/validate_graph.mjs game/script.js
          node tools/validate_graph.mjs game/script.en.js
          node tools/validate_graph.mjs game/script.jp.js
          python3 tools/check_seals.py

      - name: 헤드리스 완주 회귀
        run: |
          node tools/smoke_headless.mjs
          SNZ_LANG=en node tools/smoke_headless.mjs
          SNZ_LANG=jp node tools/smoke_headless.mjs

      - name: 구문 검사
        run: |
          for f in game/state.js game/director.js game/stage.js game/input.js game/main.js game/analytics.js; do
            node --check "$f"
          done
          python3 -m py_compile tools/*.py
